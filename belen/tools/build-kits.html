function canvas() { const c = document.createElement('canvas'); c.width = AW; c.height = AH; return c; }

}

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

    const nx = (h0 - hx) * k, ny = (h0 - hy) * k; const l = Math.hypot(nx, ny, 1);

}
function drawTex(ctx, tex, key, fallback) {

  if (tex && tex.image) ctx.drawImage(tex.image, x, y, w, h);

}
function headOnly(geo, skeleton) {

  const keep = new Set(['Head', 'neck_01'].map((n) => skeleton.bones.findIndex((b) => b.name === n)));
  const w = (v) => { let s = 0; for (let k = 0; k < 4; k++) if (keep.has(si.getComponent(v, k))) s += sw.getComponent(v, k); return s; };

  for (let i = 0; i < idx.length; i += 3) { const a = idx[i], b = idx[i + 1], c = idx[i + 2]; if (w(a) > 0.5 && w(b) > 0.5 && w(c) > 0.5) out.push(a, b, c); }

          log(sex, k, 'mat', mat.name, '->', tk, 'map', !!mat.map, 'normal', !!mat.normalMap, 'rough', !!mat.roughnessMap, mat.roughnessMap === mat.metalnessMap);
        }

        geo.setIndex(Array.from(o.geometry.index.array.slice(gr.start, gr.start + gr.count)));

        const [tx, ty, tw, th] = TILES[tk];
        const nu = new Float32Array(uv.count * 2);
        for (let i = 0; i < uv.count; i++) {
          let u = uv.getX(i), v = uv.getY(i); mn = [Math.min(mn[0], u), Math.min(mn[1], v)]; mx = [Math.max(mx[0], u), Math.max(mx[1], v)];
          u = Math.min(Math.max(u, 0), 1); v = Math.min(Math.max(v, 0), 1);

        }

        geo.setAttribute('uv', new THREE.BufferAttribute(nu, 2));

        const mm = new THREE.Matrix4().copy(refMesh.bindMatrix).invert().multiply(o.bindMatrix);
        geo.applyMatrix4(mm);
        const name = k === 'head' ? (tk === 'head' ? 'head' : tk === 'eyes' ? 'eyes' : 'lashes') : `${k}_${(o.name || 'part').replace(/^(Male|Female)_(Peasant|Ranger)_/, '').toLowerCase()}_${tk}`;
        parts.push({ name, geo });

  const [fx, fy, fw] = TILES.fabric; fabricTile(xB, fx * TILE, fy * TILE, fw * TILE, false); fabricNormal(xN, fx * TILE, fy * TILE, fw * TILE, false);
  const [wx, wy, ww] = TILES.wool; fabricTile(xB, wx * TILE, wy * TILE, ww * TILE, true); fabricNormal(xN, wx * TILE, wy * TILE, ww * TILE, true);
  const [ex, ey, ew] = TILES.white; xB.fillStyle = '#ffffff'; xB.fillRect(ex * TILE, ey * TILE, ew * TILE, ew * TILE);
  for (const [k, c] of [['fabric', 'rgb(255,235,0)'], ['wool', 'rgb(255,250,0)'], ['white', 'rgb(255,140,0)']]) { const [a, b, s] = TILES[k]; xR.fillStyle = c; xR.fillRect(a * TILE, b * TILE, s * TILE, s * TILE); }
  // canal B (metal) a cero y R (oclusión) a 255 en el mapa de rugosidad
  { const id = xR.getImageData(0, 0, AW, AH); const d = id.data; for (let i = 0; i < d.length; i += 4) { d[i] = 255; d[i + 2] = 0; } xR.putImageData(id, 0, 0); }

}

window.DONE = true;
