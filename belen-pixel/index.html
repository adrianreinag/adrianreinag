<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belén de Judá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
  /* Una sola ambientación nocturna: el lienzo manda; al pie, la cartela del día como en un belén. */
  :root {
    --night: #05060f; --ink: #e9dfc8; --muted: #a39cb0; --gold: #f2c25a; --line: #1d1e33; --chip: #12142a; --chip-on: #2a2440;
    --f-display: 'Pixelify Sans', 'Courier New', monospace;
    --f-body: 'Spectral', Georgia, 'Times New Roman', serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--ink); font-family: var(--f-body); display: flex; flex-direction: column; overflow: hidden; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #scene { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #painting { position: absolute; inset: auto 0 12px; text-align: center; font: 400 15px var(--f-display); color: var(--gold); letter-spacing: 0.08em; }
  .cartela { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 8px 24px;
    padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-top: 1px solid var(--line); }
  .story { min-width: 0; }
  #map { width: 120px; height: 92px; image-rendering: pixelated; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); align-self: center; }
  #when { margin: 0; font: 400 12px/1.2 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  #title { margin: 2px 0 4px; font: 600 clamp(18px, 2.4vw, 26px)/1.1 var(--f-display); color: var(--gold); text-wrap: balance; }
  #text { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink); font-style: italic; max-width: 72ch; }
  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .nav, #views { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  button { font: 400 14px var(--f-display); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--chip-on); border-color: var(--gold); color: var(--gold); }
  @media (max-width: 640px) {
    .cartela { grid-template-columns: auto minmax(0, 1fr); }
    #map { width: 90px; height: 69px; align-self: start; }
    .controls { grid-column: 1 / -1; }
    .controls { align-items: stretch; flex-direction: row; justify-content: space-between; flex-wrap: wrap; }
    #text { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="480" height="270" aria-label="Escena del belén en pixel art animado"></canvas>
  <div id="painting" hidden>Pintando la escena…</div>
</div>
<footer class="cartela">
  <canvas id="map" width="120" height="92" aria-label="Mapa del camino"></canvas>
  <div class="story">
    <p id="when"></p>
    <h1 id="title">Belén de Judá</h1>
    <p id="text"></p>
  </div>
  <div class="controls">
    <div id="views" aria-label="Puntos de vista"></div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Día anterior">◀ Ayer</button>
      <button type="button" id="today">Hoy</button>
      <button type="button" id="next" aria-label="Día siguiente">Mañana ▶</button>
    </div>
  </div>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
